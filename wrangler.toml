name = "busan-travel"
main = "src/worker.js"
compatibility_date = "2026-01-01"

# Worker + Static Assets
# Worker 는 /img/* 경로만 처리 (R2 이미지 서빙), 나머지는 ASSETS 바인딩으로 정적 서빙.
[assets]
directory = "./frontend/public"
binding = "ASSETS"
not_found_handling = "404-page"

# R2 버킷: 부산 이미지 뱅크 (포토코리아·Busan Archive 등 수집 이미지 + pre-gen variants)
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "busan-travel-images"

# KV: API rate limit 카운터 (60 req/min/IP, TTL 120s) — Step 1.4
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "0faeb4998cb64538bbf2a73be3aa4dc3"

# Step 2 Wave 2 — content ingest (GitHub Contents API).
# 시크릿(INGEST_API_KEY, GITHUB_TOKEN_INGEST)은 wrangler secret put 으로 등록.
[vars]
GITHUB_OWNER = "ok0327-dot"
GITHUB_REPO = "busan-travel"
INGEST_BRANCH = "main"
