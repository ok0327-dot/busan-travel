:root{

.stats span{white-space:nowrap}

.clock{font-family:var(--display);font-size:15px;color:var(--fg);letter-spacing:.3px}
.btn{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:6px;padding:7px 12px;cursor:pointer}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.small{padding:4px 8px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}

.spd .btn{padding:5px 9px;font-size:12px;border-radius:0}
.spd .btn:first-child{border-radius:6px 0 0 6px}.spd .btn:last-child{border-radius:0 6px 6px 0}
.spd .btn.on{background:var(--fg);color:var(--panel);border-color:var(--fg)}
#mapwrap{flex:1;position:relative;min-height:0;overflow:hidden;touch-action:none;background:var(--sea)}
canvas{display:block;width:100%;height:100%}
.zoom{position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:10px;display:flex;flex-direction:column;gap:6px}
.zoom .btn{width:36px;height:36px;padding:0;font-size:18px}
.hint{position:absolute;left:max(10px,env(safe-area-inset-left,0px));top:10px;font-size:11px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 8px;max-width:58%}

.chip.warn{color:var(--warn);border-color:var(--warn)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-variant-numeric:tabular-nums;margin-top:6px}
.kv span:first-child{color:var(--muted)}

.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}

.units .n{font-weight:700}.units .s{color:var(--muted);font-size:12px}
.shop{display:grid;grid-template-columns:1fr auto;gap:5px 8px;align-items:center;font-variant-numeric:tabular-nums}
.shop .s{color:var(--muted);font-size:11px}
.shop .lock{opacity:.5}
.shop .dom{grid-column:1/-1;font-size:11px;color:var(--muted);letter-spacing:.5px;margin-top:6px;border-bottom:1px solid var(--line);padding-bottom:2px}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:13px}
.log li{padding:5px 8px;border-left:3px solid var(--line);background:var(--bg);border-radius:0 4px 4px 0}
.log li.win{border-left-color:var(--good)} .log li.lose{border-left-color:var(--bad)} .log li.me{border-left-color:var(--accent)} .log li.world{border-left-color:var(--gold)}
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;font-variant-numeric:tabular-nums}
.rank li{display:grid;grid-template-columns:22px 14px 1fr auto;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line);font-size:13px}
.sw{width:12px;height:12px;border-radius:3px}
input[type=range]{width:100%;accent-color:var(--accent)}
.dialog{margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.dialog .t{font-weight:700;margin-bottom:6px}
.bar{height:8px;background:var(--bar);border-radius:4px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--accent)}
.bar.vs{display:flex}.bar.vs i{background:var(--good)}.bar.vs b{display:block;height:100%;background:var(--bad);flex:1}
.timeline{display:flex;flex-direction:column;gap:3px;font-size:12px}
.timeline .it{display:grid;grid-template-columns:52px 1fr;gap:8px;padding:4px 6px;border-radius:4px;border:1px solid var(--line)}
.timeline .it.done{opacity:.55}.timeline .it.next{border-color:var(--accent)}
.war{padding:6px 8px;border:1px solid var(--line);border-radius:6px;margin-bottom:6px;font-size:13px}
.war .f{font-size:12px;color:var(--muted);margin-top:2px}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);padding:16px}
.overlay .card{background:var(--panel);color:var(--fg);border-radius:10px;padding:20px;max-width:360px;text-align:center}
.overlay h2{font-family:var(--display);font-weight:400;font-size:28px;margin:0 0 8px}

function buildForce(code,value,sea){

  const shares={g:0.5,a:0.25,s:sea?0.12:0,m:0.05,x:0.08}; if(!sea) shares.g+=0.12;
  for(const dom in shares){ const v=value*shares[dom]; if(v<=0) continue;
    let mix=Object.entries(MIX[dom]).filter(([id])=>UB[id].y<=t); if(!mix.length) continue;
    if(dom==='s'&&v<UB.cv.c*1.5) mix=mix.filter(([id])=>id!=='cv'); if(dom==='x'&&v<UB.sat.c*2) mix=mix.filter(([id])=>id!=='sat');

    mix.forEach(([id,w])=>{ const x=v*w/tot/UB[id].c; let n=Math.floor(x); if(Math.random()<x-n) n++; add(g,id,n); });
  }
  return g;
}

// ===== 전쟁·외교 =====
function declareWar(a,b,opt={}){
  if(a===b||atWar(a,b)) return;
  S.wars[wk(a,b)]={start:S.day,cap:{},by:a};
  const an=countries[a].name,bn=countries[b].name;
  if(!opt.silent){ if(a===PLAYER){ S.trust=Math.max(0,S.trust-8); addLog(`${bn}에 선전포고 (신뢰도 −8)`,'me'); } else if(b===PLAYER) addLog(`⚠ ${an}이(가) 대한민국에 선전포고! ${opt.reason||'선제공격'}`,'lose'); else addLog(`${an} → ${bn} 선전포고${opt.reason?' ('+opt.reason+')':''}`,'world'); }
  if(opt.noHonor) return;
  // 동맹 파기 & 집단방위
  for(const bl of blocsOf(b)){
    if(bl.m.includes(a)&&!S.left.includes(a)){ S.left.push(a); addLog(`${an}, ${bl.n} 탈퇴 — 동맹국 ${bn} 공격`,a===PLAYER?'lose':'world'); }
    const joined=[];
    for(const L of bl.m){ if(L===a||L===b||!alive(L)||S.left.includes(L)||atWar(L,a)) continue; if(Math.random()<bl.p){ S.wars[wk(L,a)]={start:S.day,cap:{},by:L}; joined.push(countries[L].name); } }
    if(joined.length) addLog(`${bl.n} 집단방위 발동: ${joined.join(', ')} → ${an} 참전`,a===PLAYER?'lose':(b===PLAYER?'win':'world'));
  }
}
function makePeace(a,b,how){
  delete S.wars[wk(a,b)];
  S.fronts.filter(f=>(f.atk===a&&f.def===b)||(f.atk===b&&f.def===a)).forEach(f=>endFront(f,'return'));
  if(a===PLAYER||b===PLAYER) addLog(`${countries[a===PLAYER?b:a].name}과(와) 휴전 ${how||''}`.trim(),'me'); else addLog(`${countries[a].name}–${countries[b].name} 휴전 ${how||''}`.trim(),'world');
}
function nearestOwned(code,from){ let best=null,bd=1e9; owned(code).forEach(c=>{ const d=distKm(c,from); if(d<bd){bd=d;best=c;} }); return best; }
function endFront(f,how){
  const i=S.fronts.indexOf(f); if(i>=0) S.fronts.splice(i,1);
  if(how==='wiped'||!cnt(f.g)) return;
  const tgt=cities[f.tgt];
  if(how==='merge'){ merge(st(tgt).g,f.g); return; }
  if(how==='fail') attr(f.g,0.1);
  const src=cities[f.src]; const dest=st(src).o===f.atk?src:nearestOwned(f.atk,tgt);
  if(dest) merge(st(dest).g,f.g);
  if(how==='fail'&&(f.atk===PLAYER||f.def===PLAYER)) addLog(`${tgt.n} 공세 실패 — ${countries[f.atk].name} 군 ${dest?dest.n+'으로 후퇴':'전멸'}`,f.atk===PLAYER?'lose':'win');
}
function attr(g,rate){ let killed=0; for(const id in g){ const u=UB[id]; const x=g[id]*rate*ATTR_F[u.dom]; let k=Math.floor(x); if(Math.random()<x-k) k++; k=Math.min(g[id],k); if(k){ g[id]-=k; killed+=k; if(g[id]<=0) delete g[id]; } } return killed; }
// 전투력 계산 — 공중 우세가 지상전을 좌우하고, 바다 건너 공격은 해군이 필요
function calc(force,tgt,atk,def,sea){
  const gar=st(tgt).g, tA=techMult(S.tech[atk]), tD=techMult(S.tech[def]);
  const sum=(g,key,dom)=>Object.entries(g).reduce((s,[id,n])=>s+(UB[id].dom===dom?n*UB[id][key]:0),0);
  const aG=sum(force,'a','g'), aA=sum(force,'a','a'), aS=sum(force,'a','s');
  const dG=sum(gar,'d','g'), dA=sum(gar,'d','a'), dS=sum(gar,'d','s'), dX=sum(gar,'d','x');
  const isr=g=>1+Math.min(0.24,0.08*(g.sat||0)), cyb=g=>1-Math.min(0.3,0.08*(g.cyber||0));
  const airA=(aA+aS*0.4)*tA, airD=(dA+dX)*tD, ra=(airA+airD)>0?airA/(airA+airD):0.5;
  let A=(aG*(0.7+0.6*ra)+aA*0.4+(sea?aS*0.5:aS*0.1))*tA*isr(force)*cyb(gar); if(sea) A*=0.7;
  const terr=(tgt.cap?1.3:1.1)+(def===tgt.cc?0.1:0)-(capLost(def)?0.15:0);
  const Dv=(dG*(0.7+0.6*(1-ra))+dA*0.3+dX*0.25+(sea?dS*0.6:dS*0.1))*tD*terr*isr(gar)*cyb(force);
  return {A,D:Dv,ra};
}
function launchMissiles(force,tgt,atk){
  const d=st(tgt), def=d.o; const I=Object.entries(d.g).reduce((s,[id,n])=>s+(UB[id].sam||0)*n,0);
  let rep=[], nukes=0;
  for(const id of Object.keys(force)){ const u=UB[id]; if(!u.once) continue; const n=force[id]; delete force[id];
    const pInt=Math.min(0.9,I*0.07)*u.icpt; let hit=0; for(let i=0;i<n;i++) if(Math.random()>=pInt) hit++;
    if(u.nuke){ nukes+=hit; rep.push(`☢ 핵 ${n}기 발사 → ${hit}기 피폭${n-hit?', '+(n-hit)+'기 요격':''}`); continue; }
    const hp=Object.entries(d.g).reduce((s,[k,m])=>s+m*(UB[k].a+UB[k].d),0)*techMult(S.tech[def])+1;
    const dmg=hit*u.a*techMult(S.tech[atk])*1.2; const frac=Math.min(0.6,dmg/(hp+dmg)); attr(d.g,frac/Math.max(0.15,1)); d.E*=Math.max(0.85,1-0.004*hit);
    rep.push(`${u.n.replace(/ \d+발$/,'')} ${n}발 → 명중 ${hit}, 요격 ${n-hit}`);
  }
  if(nukes){ d.g={}; d.E*=Math.pow(0.5,nukes); d.u=0; if(atk===PLAYER) S.trust=Math.max(0,S.trust-30*nukes); addLog(`☢ ${countries[atk].name}, ${tgt.n} 핵 공격 — 수비 전멸·경제 ${Math.round(100*Math.pow(0.5,nukes))}%`,atk===PLAYER?'me':(def===PLAYER?'lose':'world'));
    // 핵 보복 (상호확증파괴)
    if(S.nuclear[def]){ const have=owned(def).map(c=>st(c).g).find(g=>g.nuke); if(have){ const n=Math.min(have.nuke,2); have.nuke-=n; if(!have.nuke) delete have.nuke; const targets=owned(atk).sort((a,b)=>st(b).E-st(a).E).slice(0,n); targets.forEach(t=>{ st(t).g={}; st(t).E*=0.5; }); addLog(`☢☢ ${countries[def].name} 핵 보복: ${targets.map(t=>t.n).join(', ')} 피폭`,atk===PLAYER?'lose':'world'); S.fronts.filter(f=>targets.some(t=>t.id===f.src)).forEach(f=>attr(f.g,0.6)); } }
  }
  if(rep.length&&(atk===PLAYER||def===PLAYER)) addLog(`${countries[atk].name} → ${tgt.n} 미사일 타격: ${rep.join(' · ')}`,atk===PLAYER?'me':'lose');

  const wars=Object.keys(S.wars).map(k=>{ const [a,b]=k.split('|'); return {a,b,w:S.wars[k],fs:S.fronts.filter(f=>(f.atk===a&&f.def===b)||(f.atk===b&&f.def===a))}; }).sort((x,y)=>((x.a===PLAYER||x.b===PLAYER)?-1:0)-((y.a===PLAYER||y.b===PLAYER)?-1:0)||y.fs.length-x.fs.length);
  const rows=Object.keys(countries).filter(alive).map(code=>({code,n:owned(code).length,m:Math.round(milPow(code)),g:gdp(code),t:S.tech[code]})).sort((a,b)=>b.n-a.n||b.m-a.m);
  pb.innerHTML=`<h3 style="margin-top:0">진행 중인 전쟁 (${wars.length})</h3>${wars.length?wars.map(x=>`<div class="war"><b>${esc(countries[x.a].name)}</b> vs <b>${esc(countries[x.b].name)}</b> <span class="muted">· ${Math.max(0,Math.floor((S.day-x.w.start)/30))}개월</span>${x.fs.map(f=>`<div class="f">${esc(countries[f.atk].name)} → ${esc(cities[f.tgt].n)} 점령도 ${pct(f.p)} <span class="${f.gain>0.0005?'good':f.gain<-0.0005?'bad':'warn'}">${f.gain>0.0005?'전진':f.gain<-0.0005?'후퇴':'교착'}</span></div>`).join('')||'<div class="f">전선 없음 (교착)</div>'}</div>`).join(''):'<p class="muted">없음</p>'}
  <h3>국력 순위</h3><ul class="rank">${rows.slice(0,40).map((r,i)=>`<li><span class="muted">${i+1}</span><span class="sw" style="background:${ownerColor(r.code)}"></span><span>${esc(countries[r.code].name)} <span class="muted">${Math.floor(r.t)}년도 기술</span></span><span class="muted">도시 ${r.n} · 군사력 ${r.m} · GDP ${fm(r.g*10)}</span></li>`).join('')}</ul><p class="muted" style="margin:8px 0 0">생존 ${rows.length}개국 / 멸망 ${Object.keys(countries).length-rows.length}개국 (상위 40개 표시)</p>`;
}
function renderInfo(){
  if(sel==null){ pb.innerHTML=`<p class="muted" style="margin:0">지도에서 도시나 나라를 탭하세요. 사각형은 수도, 원은 주요 도시, 숫자는 주둔 부대 수입니다. 내 도시를 선택한 뒤 점선 표시된 인접 도시를 탭하면 이동(초록)·공격(빨강)할 수 있습니다.</p>
    <div class="kv"><span>시간</span><span>실시간 — 10분에 1년. ▶▶는 3배속, 스페이스로 일시정지</span><span>전선</span><span>공격은 즉시 점령이 아니라 전선을 만들고, 전투력 비율에 따라 하루 단위로 점령도가 밀립니다 (3:1이면 두어 달, 1.2:1이면 1년 이상)</span><span>공중 우세</span><span>전투기·방공이 많은 쪽이 지상전 효율 +30%. 지상군이 없으면 점령 불가</span><span>해상</span><span>바다 건너 공격은 구축함·잠수함·항모가 있어야 하며 속도 −40%</span><span>기술</span><span>각국 기술 연도(n년도 기술)가 1년 차이마다 전투 효율 4%</span><span>선공</span><span>AI도 야욕·숙적 관계에 따라 선제공격합니다. 동맹(집단방위)과 핵 억지가 이를 억제합니다</span><span>저항</span><span>점령지는 주둔 지상군이 부족하면 봉기 게이지(노란 원)가 차서 원래 나라로 돌아갑니다</span></div>`; return; }
  const c=cities[sel], cs=st(c), mineC=cs.o===PLAYER, f=frontOn(c.id), oc=countries[cs.o];
  const need=Math.ceil(Math.sqrt(c.pop)*1.5);
  let h=`<div class="city-h"><span class="name">${esc(c.n)}</span><span class="chip ${mineC?'mine':''}">${mineC?'아군':esc(oc.name)+' 소유'}</span><span class="chip">${c.cap?'수도':'주요 도시'} · ${esc(countries[c.cc].name)}</span><span class="chip">${ftech(S.tech[cs.o])}</span>${S.nuclear[cs.o]?'<span class="chip warn">☢ 핵보유</span>':''}${blocsOf(cs.o).map(b=>`<span class="chip">${esc(b.n)}</span>`).join('')}</div>
  <div class="kv"><span>GDP</span><span>${fm(cs.E*10)}</span><span>방어력</span><span>${Math.round(calc({},c,cs.o,cs.o,false).D)} (효율 ×${techMult(S.tech[cs.o]).toFixed(2)})</span>${cs.o!==c.cc?`<span>점령지 저항</span><span>${pct(cs.u)} ${domN(cs.g,'g')>=need?'<span class="good">안정 (지상군 충분)</span>':`<span class="bad">지상군 ${need}개 대대 필요</span>`}</span>`:''}${mineC&&atWar(PLAYER,cs.o)?'':''}</div>
  <h3>주둔 병력 (${cnt(cs.g)})</h3>${garHtml(cs.g)}`;
  if(f) h+=frontHtml(f);
  if(mineC){
    const ul=unlocked(PLAYER); let lastDom='';
    h+=`<h3>생산 — 자금 ${fm(S.money[PLAYER])}</h3><div class="shop">${UNITS.map(u=>{ const ok=ul.includes(u); if(!ok&&u.nuke) return ''; const dh=u.dom!==lastDom?`<span class="dom">${DOM_N[u.dom]}</span>`:''; lastDom=u.dom;
      return dh+`<span class="${ok?'':'lock'}"><b>${u.n}</b> <span class="s">${esc(u.s)} · ${fm(u.c)} · ${u.once?'타격 '+u.a:'공'+u.a+' 방'+u.d} · ${u.y}년도 기술</span></span><span>${ok?`<button class="btn small" data-b="${u.id}" data-n="1" ${S.money[PLAYER]<u.c?'disabled':''}>+1</button> <button class="btn small" data-b="${u.id}" data-n="5" ${S.money[PLAYER]<u.c*5?'disabled':''}>+5</button>`:`<span class="muted" style="font-size:11px">🔒 ${u.y}년도</span>`}</span>`; }).join('')}</div>`;
    const en=cities.filter(t=>adj(c,t)&&st(t).o!==PLAYER);
    h+=`<p class="muted" style="margin:8px 0 0">인접 타국 도시: ${en.length?en.map(t=>esc(t.n)+' ('+esc(countries[st(t).o].name)+', 방어 '+Math.round(calc({},t,PLAYER,st(t).o,false).D)+(atWar(PLAYER,st(t).o)?', 교전 중':'')+')').join(', '):'없음'}</p>`;
  }
  if(dlg){
    const fr=cities[dlg.from], t=cities[dlg.to], fs=st(fr), tgtO=st(t).o; const tmp=portion(fs.g,dlg.pct); const sea=isSea(fr,t); const ex=frontOn(t.id);
    let warn=[]; if(dlg.kind==='attack'){ if(ex&&ex.atk!==PLAYER) warn.push(`${esc(countries[ex.atk].name)}이(가) 이미 공격 중인 도시 — 개입 불가`); if(sea&&!domN(tmp,'s')) warn.push('상륙작전에는 해상 전력(구축함·잠수함·항모)이 필요'); if(!domN(tmp,'g')) warn.push('지상군 없이는 점령 불가 (타격만 가능)'); if(S.nuclear[tgtO]) warn.push(`${esc(countries[tgtO].name)}은(는) 핵보유국 — 수도 함락 임박 시 핵 보복 위험. 방공포대로 요격 가능`); if(!atWar(PLAYER,tgtO)){ warn.push('선전포고 (신뢰 −8)'); for(const bl of blocsOf(tgtO)){ if(bl.m.includes(PLAYER)) warn.push(`${esc(bl.n)} 동맹국 공격 → 동맹 파기, 회원국 참전 확률 ${Math.round(bl.p*100)}%`); else warn.push(`${esc(bl.n)} 회원국 — 다른 회원국 참전 확률 ${Math.round(bl.p*100)}%`); } } }
    const est=dlg.kind==='attack'?calc(tmp,t,PLAYER,tgtO,sea):null; const canAct=cnt(tmp)>0&&!(dlg.kind==='attack'&&ex&&ex.atk!==PLAYER)&&!(dlg.kind==='attack'&&sea&&!domN(tmp,'s')&&!ex);
    h+=`<div class="dialog"><div class="t">${esc(fr.n)} → ${esc(t.n)} ${dlg.kind==='attack'?(ex?'전선 증원':'공격'):'이동'}${sea?' (해상)':''}</div>
    <label for="pct">보낼 비율: <b id="pv">${dlg.pct}</b>% (${cnt(tmp)}개 부대)</label><input type="range" id="pct" min="10" max="100" step="10" value="${dlg.pct}">
    ${est?`<div class="kv"><span>예상 전투력</span><span>공 ${Math.round(est.A)} : 방 ${Math.round(est.D)} → ${est.D>0?(est.A/est.D).toFixed(2)+'배':'무방비'} ${est.A/(est.D+0.001)>=1.5?'<span class="good">우세</span>':est.A/(est.D+0.001)>=1?'<span class="warn">근소 우세 — 장기전</span>':'<span class="bad">열세</span>'}</span><span>공중 우세</span><span>${Math.round(est.ra*100)}%</span></div>`:`<div class="kv"><span>소요</span><span>${cnt(tmp)?travelDays(fr,t,tmp):0}일</span></div>`}
    ${warn.length?`<p class="warn" style="margin:6px 0 0;font-size:12px">⚠ ${warn.join(' · ')}</p>`:''}
    <div class="row"><button class="btn primary" id="go" ${canAct?'':'disabled'}>${dlg.kind==='attack'?(ex?'증원 투입':'공세 개시'):'이동'}</button><button class="btn" id="cancel">취소</button></div></div>`;
  }
  pb.innerHTML=h;
  pb.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{ const u=UB[b.dataset.b]; let n=+b.dataset.n; n=Math.min(n,Math.floor(S.money[PLAYER]/u.c)); if(n<=0) return; cs.g[u.id]=(cs.g[u.id]||0)+n; S.money[PLAYER]-=n*u.c; save(); render(); });
  const rt=pb.querySelector('#retreat'); if(rt&&f) rt.onclick=()=>{ endFront(f,'fail'); addLog(`${c.n} 전선에서 후퇴`,'me'); save(); render(); };
  const rg=pb.querySelector('#pct'); if(rg){ rg.oninput=()=>{dlg.pct=+rg.value; render();};
    pb.querySelector('#cancel').onclick=()=>{dlg=null;render();};
    pb.querySelector('#go').onclick=()=>{ const fr=cities[dlg.from],t=cities[dlg.to];
      if(dlg.kind==='move'){ const sent=split(st(fr).g,dlg.pct); moveUnits(fr,t,sent,PLAYER); addLog(`${fr.n} → ${t.n} ${cnt(sent)}개 부대 이동 (${travelDays(fr,t,sent)}일)`,'me'); }
      else { const nf=openFront(fr,t,dlg.pct,true); if(nf) sel=t.id; }
      dlg=null; if(S.speed===0) setSpeed(1); save(); render(); };
  }
}
function showOver(){
  let o=document.getElementById('over');
  if(!S.over){ if(o) o.remove(); return; }
  if(o) return;
  o=document.createElement('div'); o.className='overlay'; o.id='over';
  o.innerHTML=S.over==='win'?`<div class="card"><h2>세계 패권</h2><p>${fdate(S.day)}, 대한민국이 세계 경제의 60% 이상을 지배합니다. (${owned(PLAYER).length}개 도시)</p><button class="btn primary" id="again">새 게임</button></div>`
    :`<div class="card"><h2>대한민국 멸망</h2><p>${fdate(S.day)}에 마지막 도시를 잃었습니다.</p><button class="btn primary" id="again">다시 도전</button></div>`;
  document.getElementById('mapwrap').appendChild(o); o.querySelector('#again').onclick=newGame;
}
function newGame(){ fresh(); sel=null; dlg=null; tab='info'; setSpeed(0); save(); render(); }
document.getElementById('newGame').onclick=()=>{ const b=document.getElementById('newGame'); if(b.dataset.c==='1'){ b.dataset.c=''; b.textContent='초기화'; newGame(); } else { b.dataset.c='1'; b.textContent='정말 초기화? 다시 탭'; setTimeout(()=>{b.dataset.c='';b.textContent='초기화';},2500); } };
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',draw);
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&S){ save(); } last=performance.now(); acc=0; });

function start(hot){
  S=(hot&&hot.S)||load(); if(!S) fresh();
  S.speed=0; setSpeed(0);
  try{ window.claude?.hot?.snapshot?.(()=>({S})); }catch(e){}
  resize(); centerOn(127,37,3); render(); last=performance.now(); requestAnimationFrame(frame);
}
window.__sim=(days)=>{ for(let i=0;i<days;i++) tickDay(); render(); };
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
