<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- 부산 sunset gradient: orange → magenta → night -->
    <linearGradient id="sky" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#F4A261"/>
      <stop offset="0.42" stop-color="#E76F51"/>
      <stop offset="1" stop-color="#1D3557"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FEF3C7" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FEF3C7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Rounded square — iOS/Android maskable safe -->
  <rect width="512" height="512" rx="96" fill="url(#sky)"/>

  <!-- Soft sun aura behind seagull -->
  <circle cx="256" cy="220" r="160" fill="url(#sunGlow)"/>

  <!-- Wave layers (lower 1/4) -->
  <g stroke="#ffffff" stroke-linecap="round" fill="none">
    <path d="M 70 408 Q 160 388 256 408 T 442 408" stroke-width="11" opacity="0.85"/>
    <path d="M 70 440 Q 160 420 256 440 T 442 440" stroke-width="9" opacity="0.6"/>
    <path d="M 70 470 Q 160 452 256 470 T 442 470" stroke-width="7" opacity="0.4"/>
  </g>

  <!-- ───── 부기 (Boogi) — 부산 갈매기 마스코트 ───── -->
  <g transform="translate(256, 250)">
    <!-- 펼친 날개 (양쪽, 부드러운 V) -->
    <path d="M -52 -8 Q -148 -70 -212 -28 Q -130 -14 -60 14 Z"
          fill="#ffffff" stroke="#1D3557" stroke-width="4" stroke-linejoin="round"/>
    <path d="M 52 -8 Q 148 -70 212 -28 Q 130 -14 60 14 Z"
          fill="#ffffff" stroke="#1D3557" stroke-width="4" stroke-linejoin="round"/>

    <!-- 몸통 (둥근 타원) -->
    <ellipse cx="0" cy="34" rx="68" ry="56" fill="#ffffff" stroke="#1D3557" stroke-width="4"/>

    <!-- 가슴 보라색 액센트 (부기 시그니처 컬러) -->
    <path d="M -28 26 Q 0 50 28 26" stroke="#7C3AED" stroke-width="6" stroke-linecap="round" fill="none"/>

    <!-- 머리 -->
    <circle cx="0" cy="-32" r="48" fill="#ffffff" stroke="#1D3557" stroke-width="4"/>

    <!-- 머리 위 보라 곡선 (부기 시그니처 깃털) -->
    <path d="M -32 -68 Q 0 -90 32 -68" stroke="#7C3AED" stroke-width="7" stroke-linecap="round" fill="none"/>

    <!-- 노란 부리 (다이아몬드형) -->
    <path d="M -14 -24 L 14 -24 L 22 -8 L 0 0 L -22 -8 Z"
          fill="#FBBF24" stroke="#D97706" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- 큰 눈 (둥글고 친근하게) -->
    <circle cx="-16" cy="-42" r="8" fill="#1D3557"/>
    <circle cx="16" cy="-42" r="8" fill="#1D3557"/>
    <circle cx="-13" cy="-45" r="3" fill="#ffffff"/>
    <circle cx="19" cy="-45" r="3" fill="#ffffff"/>

    <!-- 볼터치 (귀여움) -->
    <circle cx="-32" cy="-22" r="6" fill="#FCA5A5" opacity="0.7"/>
    <circle cx="32" cy="-22" r="6" fill="#FCA5A5" opacity="0.7"/>
  </g>
</svg>
