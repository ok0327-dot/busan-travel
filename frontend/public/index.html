<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="주말부산" />
  <title>주말부산</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <!-- Map container (full viewport) -->
  <div id="map" aria-label="부산 지도"></div>

  <!-- Top chip bar (date presets) -->
  <header id="topbar">
    <div class="chip-row" role="tablist" aria-label="날짜 선택">
      <button class="chip active" data-preset="today">오늘</button>
      <button class="chip" data-preset="tomorrow">내일</button>
      <button class="chip" data-preset="weekend">이번 주말</button>
      <button class="chip" data-preset="next-weekend">다음 주말</button>
      <button class="chip" data-preset="custom">날짜 선택</button>
    </div>
    <!-- 선택 날짜 한눈에: 날씨 + 행사 수 + 제철 종 (applyDateFilter 가 렌더) -->
    <div id="date-badge" class="date-badge" role="status" aria-live="polite" hidden></div>
  </header>

  <!-- Bottom sheet (category filters + card list) -->
  <aside id="sheet" class="sheet-peek" aria-label="카테고리 및 상세">
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="sheet-header">
      <div class="tab-row" role="tablist">
        <button class="tab active" data-view="map"><i class="ph-bold ph-map-trifold"></i> 지도</button>
        <button class="tab" data-view="course"><i class="ph-bold ph-path"></i> 코스</button>
        <button class="tab" data-view="read"><i class="ph-bold ph-book-open-text"></i> 읽을거리</button>
      </div>
      <div class="filter-row" role="group" aria-label="카테고리 필터">
        <!-- 별표는 각 카테고리 내 ★ 배지로 표시. 기본 on: 축제·블로그. 명소/맛집/카페 는 사용자가 필요 시 on -->
        <label class="filter"><input type="checkbox" data-cat="festival" checked> <i class="ph-bold ph-confetti"></i> 축제</label>
        <label class="filter"><input type="checkbox" data-cat="exhibition" checked> <i class="ph-bold ph-palette"></i> 전시</label>
        <label class="filter"><input type="checkbox" data-cat="performance" checked> <i class="ph-bold ph-music-notes"></i> 공연</label>
        <label class="filter"><input type="checkbox" data-cat="blog" checked> <i class="ph-bold ph-notebook"></i> 블로그</label>
        <label class="filter"><input type="checkbox" data-cat="attraction"> <i class="ph-bold ph-buildings"></i> 명소</label>
        <label class="filter"><input type="checkbox" data-cat="food"> <i class="ph-bold ph-bowl-food"></i> 맛집</label>
        <label class="filter"><input type="checkbox" data-cat="cafe"> <i class="ph-bold ph-coffee"></i> 카페</label>
        <label class="filter"><input type="checkbox" data-cat="theme"> <i class="ph-bold ph-compass-rose"></i> 테마</label>
      </div>
      <div class="status-row">
        <span id="status">로딩 중…</span>
      </div>
    </div>
    <div class="sheet-body">
      <div id="card-list" class="card-list" aria-live="polite"></div>
      <div class="sheet-credit">built by minuk kang</div>
    </div>
  </aside>

  <!-- Floating action button: 내 위치 -->
  <button id="fab-locate" class="fab" aria-label="내 위치로 이동"><i class="ph-bold ph-navigation-arrow"></i></button>

  <!-- Config + main -->
  <script src="./config.js"></script>
  <script type="module" src="./main.js"></script>
</body>
</html>
