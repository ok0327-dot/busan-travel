name: busan-travel collector

# 데이터 수집 + 프론트엔드 JSON export + self-commit.
# KST 06:23 매일 전체 수집, 3시간마다 단기예보 갱신.

on:
  schedule:
    - cron: '23 21 * * *'     # 매일 KST 06:23 — 전체 수집
    - cron: '37 */3 * * *'    # 3시간마다 — 날씨만
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 모드'
        required: true
        default: 'all'
        type: choice
        options: [all, events-only, weather-only]

permissions:
  contents: write

concurrency:
  group: busan-travel-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify vendored gov-api-kr
        run: |
          if [ ! -f vendor/gov-api-kr/snippets/_caller_template.py ]; then
            echo "::error::vendor/gov-api-kr/ 누락"; exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Lint overrides (audit P1-2 가드 / classification override coverage)
        run: python scripts/lint_overrides.py

      - name: Restore SQLite cache (fallback)
        uses: actions/cache@v4
        with:
          path: data/events.db
          key: busan-travel-db-v1-${{ github.run_id }}
          restore-keys: busan-travel-db-v1-

      - name: Ensure data dirs
        run: mkdir -p data frontend/public/data

      # R2 download — 우선순위 cache 보다 높음 (R2 에 있으면 cache 덮어씀).
      # credentials 미설정 시 db_sync.py 가 exit 0 (graceful degrade — 첫 실행 보호).
      # 그 외 다운로드 실패는 step fail 로 전파 → workflow fail → Issue 생성.
      - name: Restore events.db from R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python scripts/db_sync.py download

      - name: Determine mode
        id: mode
        run: |
          INPUT="${{ github.event.inputs.mode }}"
          CRON="${{ github.event.schedule }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${INPUT:-all}"
          elif [ "$CRON" = "23 21 * * *" ]; then
            MODE="all"
          elif [ "$CRON" = "37 */3 * * *" ]; then
            MODE="weather-only"
          else
            MODE="all"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "-> mode=$MODE"

      - name: Events + POIs
        if: steps.mode.outputs.mode != 'weather-only'
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python main.py

      # P1-4 — RSS 신규 글 자동 라벨/좌표 (audit 2026-04-25)
      # apply_blog_labels.py = 정적 수동 라벨 (LLM 무관, idempotent)
      # geocode_blogs.py = lat IS NULL 인 row 만 Gemini+Kakao 로 좌표 해소 (idempotent)
      - name: Apply blog labels (정적 수동 라벨 / static labels)
        if: steps.mode.outputs.mode != 'weather-only'
        run: python scripts/apply_blog_labels.py

      # GEMINI_API_KEY 누락 시 exit 1 → step fail (P0-4 silent skip 차단 정신).
      # KAKAO_REST_KEY 누락 시 graceful skip — 좌표 해소만 건너뜀, 장소명 추출은 진행.
      - name: Geocode blog posts (Gemini + Kakao, lat IS NULL 만)
        if: steps.mode.outputs.mode != 'weather-only'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
        run: python scripts/geocode_blogs.py

      - name: Seed beach POIs
        if: steps.mode.outputs.mode != 'weather-only'
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python -m sources.gov_beach

      - name: KMA short-range weather
        if: steps.mode.outputs.mode != 'events-only'
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python -m sources.weather_kma_short

      - name: KMA mid-range (승인 전 SKIP)
        if: steps.mode.outputs.mode != 'events-only'
        continue-on-error: true
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python -m sources.weather_kma_mid

      - name: Air quality (승인 전 SKIP)
        if: steps.mode.outputs.mode != 'events-only'
        continue-on-error: true
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python -m sources.air_korea

      # mode → scope 매핑:
      #   all          → all      (places + weather + manifest)
      #   events-only  → events   (places 만, weather 안건드림)
      #   weather-only → weather  (weather-short/mid/air-quality 만, places 보존)
      # weather-only 빌드가 옛 events.db 로 places.json 을 덮어쓰던 silent overwrite 차단.
      - name: Export JSON
        run: |
          MODE="${{ steps.mode.outputs.mode }}"
          case "$MODE" in
            weather-only) SCOPE=weather ;;
            events-only)  SCOPE=events ;;
            *)            SCOPE=all ;;
          esac
          echo "-> scope=$SCOPE"
          python scripts/export_json.py --scope "$SCOPE"

      # 회귀 테스트 — audit 2026-04-25 P0/P1 정합성 자동 검증
      - name: Verify info flow (audit 회귀 테스트)
        if: steps.mode.outputs.mode != 'weather-only'
        run: python scripts/verify_info_flow.py

      # GEMINI_API_KEY 누락 시 ai_summary.py 가 exit 1 → step fail → workflow fail.
      # silent skip 으로 어제 picks 가 stale 노출되던 위험 차단.
      - name: AI summary (Gemini 2.5 Flash, 매일만)
        if: steps.mode.outputs.mode == 'all'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/ai_summary.py

      - name: Commit & push data
        run: |
          git config user.email "claude-bot@users.noreply.github.com"
          git config user.name "busan-travel-bot"
          git add frontend/public/data/
          if git diff --staged --quiet; then
            echo "no data changes"
          else
            TS=$(date -u +'%Y-%m-%dT%H:%MZ')
            # [skip ci] 미부착: collect.yml 자체는 schedule trigger 만이라
            # GitHub Actions 무한 루프 위험 없음. Cloudflare Workers Builds 가
            # 매 commit 자동 deploy 하도록 (기존엔 [skip ci] 때문에 라이브 stale).
            git commit -m "data: auto-update $TS (${{ steps.mode.outputs.mode }})"
            git push
          fi

      # R2 backup — 어댑터들이 새로 fetch 한 db 영속화. cache 보다 안정.
      # P1-5 (audit 2026-04-25): upload 가 latest + db/archive/events-YYYY-MM-DD.db 둘 다 저장.
      # if: always() 제거 — 앞 step (어댑터/export/ai-summary) 이 실패하면 R2 갱신 안 함.
      # 어제 정상 db 가 R2 에 그대로 남아 있어야 다음 빌드가 fresh start 위험 없이 재시도 가능.
      - name: Backup events.db to R2 (latest + daily archive)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python scripts/db_sync.py upload

      # P1-5 — 30일 retention rule (idempotent, 권한 부족 시 graceful)
      - name: Setup R2 archive lifecycle (idempotent, 30d)
        continue-on-error: true
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python scripts/db_sync.py setup-lifecycle

      # P1 — cron 실패 시 GitHub Issue 자동 생성 (사용자 알림용)
      # 같은 날 동일 모드 실패가 이미 열려있으면 새 issue 생성 안 함 (중복 방지)
      - name: Notify on failure (open GitHub Issue)
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MODE="${{ steps.mode.outputs.mode }}"
          DAY=$(date -u +'%Y-%m-%d')
          TITLE="[cron 실패] $DAY · $MODE 모드"
          # 동일 제목 open issue 가 있으면 skip
          EXISTING=$(gh issue list --state open --search "in:title \"$DAY\" \"$MODE\"" --json number --jq 'length')
          if [ "$EXISTING" -gt 0 ]; then
            echo "duplicate issue exists ($EXISTING). skip"
            exit 0
          fi
          BODY="busan-travel collector workflow 실패. 점검 필요.

          - 실행 모드: \`$MODE\`
          - 워크플로 run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - 트리거: \`${{ github.event_name }}\`
          - 시각: $(date -u +'%Y-%m-%dT%H:%M:%SZ')

          ## 점검 체크리스트
          - [ ] Run log 에서 어떤 step 이 실패했는지
          - [ ] 외부 API (data.go.kr, visitbusan, 다봄, naver) 다운/스키마 변경 여부
          - [ ] DATA_GO_KR_KEY / NAVER_CLIENT_ID/SECRET / GEMINI_API_KEY 만료 여부
          - [ ] 수정 후 \`workflow_dispatch\` 로 재실행"
          gh issue create --title "$TITLE" --body "$BODY" --label "cron-failure"
